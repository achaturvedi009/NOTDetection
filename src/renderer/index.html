<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Anti-Detect Browser</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 20px; background-color: #f4f4f4; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { font-size: 24px; color: #333; }
        .controls { margin-bottom: 20px; }
        input, button { padding: 10px; margin-right: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #007bff; color: white; cursor: pointer; }
        button:hover { background: #0056b3; }
        .profile-list { list-style: none; padding: 0; }
        .profile-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #ddd; }
        .profile-actions button { margin-left: 5px; padding: 5px 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Profile Manager</h1>
        <div class="controls">
            <input type="text" id="profileName" placeholder="Enter Profile Name" />
            <select id="proxyType">
                <option value="direct">Direct (No Proxy)</option>
                <option value="http">HTTP</option>
                <option value="socks5">SOCKS5</option>
            </select>
            <input type="text" id="proxyHost" placeholder="Host (e.g. 1.2.3.4)" />
            <input type="number" id="proxyPort" placeholder="Port" style="width: 80px;" />
            <button id="createBtn">Create Profile</button>
        </div>

        <ul id="profiles" class="profile-list">
            <!-- Profiles loaded here -->
        </ul>
    </div>

    <script src="./renderer.bundle.js"></script>
</body>
</html>
